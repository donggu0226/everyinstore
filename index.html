<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Everyinstore</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f5;
      color: #111;
    }
    .hero {
      text-align: center;
      padding: 48px 24px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: clamp(2.2rem, 7vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.05em;
    }
    .logo-mark {
      width: 0.95em;
      height: 0.95em;
      border-radius: 22%;
      display: grid;
      place-items: center;
      background: #111;
      color: white;
      font-size: 0.45em;
      letter-spacing: 0;
    }
    .tagline {
      margin-top: 16px;
      font-size: 1rem;
      color: #666;
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="logo" aria-label="Everyinstore logo">
      <span class="logo-mark">E</span>
      <span>Everyinstore</span>
    </div>
    <p class="tagline">Korea-sourced finds, curated for the world.</p>
  </main>
</body>
</html>
